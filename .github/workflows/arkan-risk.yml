# arkan-risk: give each pull request a risk label, auto or manual, that its author
# cannot pick. arkan-merge reads it: an auto pr merges on the agent verifier's
# PASS, a manual pr only on a person's PASS. the marker format is seam row 6
# (docs/seam.md in arkan).
# copy this file to .github/workflows/arkan-risk.yml. setup: ci/README.md in arkan.
name: arkan-risk

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: arkan-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  arkan-risk:
    name: arkan-risk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      BASE: ${{ github.event.pull_request.base.ref }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      OWNER: ${{ github.repository_owner }}
      # the list of paths that always need a person, read from the base branch,
      # so a pr cannot edit the list to escape it.
      PATHS_FILE: docs/agents/sensitive-paths.md
      RISK_VOTE: "on"
      RISK_MODEL: deepseek-v4.1-flash
      RISK_MAX_TURNS: "8"
      CODEX_ENABLED: ${{ secrets.CODEX_AUTH_JSON != '' }}
      CLAUDE_ENABLED: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fixed rules
        id: rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # every path the pr touches, renames by both names.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' >"$RUNNER_TEMP/changed.txt"
          label="" reason=""
          manual() { label=manual reason="$1"; }

          if [ "$AUTHOR" != "$OWNER" ]; then
            manual "the author, $AUTHOR, is not the repo owner"
          elif [ ! -f "$PATHS_FILE" ]; then
            manual "$BASE has no $PATHS_FILE, so every path counts as sensitive"
          else
            # the globs are the lines of the first fenced block, minus blanks and # comments.
            patterns=$(awk '/^```/{n++; next} n==1' "$PATHS_FILE" | sed -e 's/#.*//' -e 's/[[:space:]]*$//' | grep -v '^$' || true)
            while IFS= read -r f; do
              while IFS= read -r p; do
                [ -n "$p" ] || continue
                # an unquoted case pattern is a glob; * and ** also match /.
                # shellcheck disable=SC2254
                case "$f" in $p) manual "it touches $f, a sensitive path ($p)"; break 2 ;; esac
              done <<<"$patterns"
            done <"$RUNNER_TEMP/changed.txt"
          fi
          if [ -z "$label" ] && [ "$RISK_VOTE" != on ]; then
            manual "no fixed rule applies, and the vote is off (RISK_VOTE), so it starts strict"
          fi
          if [ -z "$label" ]; then
            echo "vote=yes" >>"$GITHUB_OUTPUT"
          else
            { echo "label=$label"; echo "reason=$reason"; } >>"$GITHUB_OUTPUT"
          fi

      - name: Read the trusted runner
        id: runner
        if: steps.rules.outputs.vote == 'yes'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          runner="$RUNNER_TEMP/opencode_agent.py"
          rm -f "$runner"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "reason=the base commit is not in this checkout" >>"$GITHUB_OUTPUT"
          elif ! git show "$BASE_SHA:ci/opencode_agent.py" >"$runner" 2>/dev/null || [ ! -s "$runner" ]; then
            echo "reason=the base branch has no trusted runner ci/opencode_agent.py" >>"$GITHUB_OUTPUT"
          elif ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "reason=the head commit is not in this checkout, so the vote cannot read it" >>"$GITHUB_OUTPUT"
          else
            echo "ready=yes" >>"$GITHUB_OUTPUT"
          fi

      - name: Install the subscription fallback clients
        if: steps.runner.outputs.ready == 'yes' && (env.CODEX_ENABLED == 'true' || env.CLAUDE_ENABLED == 'true')
        run: |
          install() {
            prefix="$RUNNER_TEMP/arkan-native/$1"
            if npm install --prefix "$prefix" --no-save --no-audit --no-fund "$2"; then
              echo "$prefix/node_modules/.bin" >>"$GITHUB_PATH"
            else
              echo "::warning title=arkan-risk::could not install $2, so the $1 fallback is unavailable"
            fi
          }
          cd "$RUNNER_TEMP"
          if [ "$CODEX_ENABLED" = true ]; then install codex "@openai/codex@0.162.1"; fi
          if [ "$CLAUDE_ENABLED" = true ]; then install claude "@anthropic-ai/claude-code@2.1.304"; fi

      - name: Vote
        id: vote
        if: steps.rules.outputs.vote == 'yes'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_READY: ${{ steps.runner.outputs.ready }}
          RUNNER_REASON: ${{ steps.runner.outputs.reason }}
        run: |
          out="$RUNNER_TEMP/arkan-vote.out"
          runner="$RUNNER_TEMP/opencode_agent.py"
          rm -f "$out"
          manual() { printf 'label=manual\nreason=%s\n' "$1" >"$out"; }
          if [ "$RUNNER_READY" != yes ]; then
            manual "${RUNNER_REASON:-the trusted runner check did not finish}"
          elif ! python3 -E -s -B "$runner" risk \
            --repo "$GITHUB_WORKSPACE" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --from "$BASE_SHA" \
            --model "$RISK_MODEL" \
            --max-turns "$RISK_MAX_TURNS" \
            --github-output "$out"; then
            manual "the vote failed, so the pr is manual"
          fi
          label=$(sed -n 's/^label=//p' "$out" | head -n1)
          reason=$(sed -n 's/^reason=//p' "$out" | head -n1)
          case "$label" in
            auto|manual) ;;
            *)
              manual "the vote returned no label, so the pr is manual"
              label=$(sed -n 's/^label=//p' "$out" | head -n1)
              reason=$(sed -n 's/^reason=//p' "$out" | head -n1)
              ;;
          esac
          {
            printf 'label=%s\n' "$label"
            printf 'reason=%s\n' "$reason"
          } >>"$GITHUB_OUTPUT"

      - name: Post the label
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.rules.outputs.label || steps.vote.outputs.label }}
          REASON: ${{ steps.rules.outputs.reason || steps.vote.outputs.reason }}
        run: |
          case "$LABEL" in auto|manual) ;; *) echo "::error title=arkan-risk::no label"; exit 1 ;; esac
          # the first line is the marker arkan-merge reads. only a comment by
          # github-actions[bot] counts, so nobody else can plant one.
          body=$(printf '<!-- arkan:risk head=%s label=%s -->\n**arkan-risk:** `%s` on `%s`: %s.\n' "$HEAD" "$LABEL" "$LABEL" "${HEAD:0:7}" "$REASON")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- arkan:risk "))) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
          # the pr label is for people to see; arkan-merge never reads it.
          other=auto; [ "$LABEL" = auto ] && other=manual
          gh label create "arkan:$LABEL" --repo "$GITHUB_REPOSITORY" --color ededed >/dev/null 2>&1 || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "arkan:$LABEL" --remove-label "arkan:$other" >/dev/null 2>&1 \
            || gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "arkan:$LABEL" >/dev/null
          echo "arkan-risk: $LABEL ($REASON)"
